# nginx in front of the bot.
#
#   /etc/nginx/sites-available/reistor-stylist
#   ln -s /etc/nginx/sites-available/reistor-stylist /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Replace stylist.reistor.in with your own hostname before using this.
#
# nginx handles TLS, and the Node process listens only on loopback. That split
# matters: Meta will not deliver webhooks to a bare IP or a self-signed
# certificate, and the bot itself has no TLS support and does not want any.

server {
    listen 80;
    listen [::]:80;
    server_name stylist.reistor.in;

    # certbot writes its challenge here; everything else is redirected.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name stylist.reistor.in;

    # Written by: certbot --nginx -d stylist.reistor.in
    ssl_certificate     /etc/letsencrypt/live/stylist.reistor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stylist.reistor.in/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # The dashboard is guarded by DASHBOARD_TOKEN, but it should never be
    # indexed even if the link leaks.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    # Meta's webhook payloads are small; a large body here is not ours.
    client_max_body_size 1m;

    access_log /var/log/nginx/reistor-stylist.access.log;
    error_log  /var/log/nginx/reistor-stylist.error.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DO NOT enable any request body transformation here. The webhook
        # signature is an HMAC over the exact bytes Meta sent, so anything that
        # rewrites, buffers-and-reserialises or re-encodes the body makes every
        # signature check fail with no useful error.
        proxy_request_buffering on;

        # The handler answers Meta immediately and works in the background, so
        # these are generous only for the dashboard's queries.
        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Health check, kept out of the access log so it does not drown real traffic.
    location = /health {
        proxy_pass http://127.0.0.1:8787/health;
        access_log off;
    }
}
