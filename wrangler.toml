name = "reistor-ai-stylist"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# Per-user conversation state, keyed by the WhatsApp `wa_id` (sender number).
# Create it once with:
#   wrangler kv namespace create STATE
#   wrangler kv namespace create STATE --preview
# then paste the returned ids below.
[[kv_namespaces]]
binding = "STATE"
id = "48fa62c587d2470e8cb2082ac48c3f09"
preview_id = "02b33756589944c3baed19de848a9124"

[vars]
# Graph API version used for every outbound WhatsApp call. Interactive product
# carousels are a newer message type — v21.0 rejects them.
GRAPH_API_VERSION = "v25.0"

# Commerce catalog connected to the WABA. Recommended looks render as a
# product carousel whose cards open WhatsApp's own PDP. Unset it and the looks
# fall back to plain image messages.
CATALOG_ID = "1572339217700903"

# Shopify CDN transform applied to every catalog image. Product shots are
# 2:3 portrait, so a square centre-crop loses heads and feet — `crop=top`
# keeps the face. Re-run /admin/catalog after changing this.
CATALOG_IMAGE_TRANSFORM = "width=1080&height=1080&crop=top"

# Shopify product metafield holding bespoke artwork for the PDP abandonment
# card. `file_reference` type, so its raw value is a MediaImage gid —
# /admin/metafields resolves that to a CDN url.
PDP_IMAGE_METAFIELD = "custom.kwikengage_product_image"

# Which checkout the Buy Now button opens.
#   whatsapp — order_details; the payment sheet opens INSIDE the chat. Needs
#              WHATSAPP_PAYMENT_CONFIG plus a verified business, and falls back
#              to a Razorpay link if Meta rejects the send
#   razorpay — a payment link, opened in WhatsApp's in-app browser
#   fastrr   — a Shopify cart permalink; Shiprocket's Fastrr panel takes over
#   gokwik   — the identical permalink; GoKwik takes over instead
#
# fastrr and gokwik send the SAME url. Which one answers is decided by the app
# installed on reistor.in — and GoKwik's script actively neutralises Fastrr, so
# Fastrr cannot take over until GoKwik is removed from the store.
CHECKOUT_PROVIDER = "whatsapp"

# Where that link lands: "cart" (default) or "checkout". One-click apps replace
# the button on the cart page, so jumping straight to /checkout bypasses them
# and hands the shopper Shopify's own checkout.
CHECKOUT_LANDING = "cart"

# Per-occasion category artwork — 30 cards in dashboard/public/categories,
# one set per occasion. "off" falls back to the shared images on CATEGORIES,
# which is the behaviour before the photography landed. Flip to "on" once the
# images have been checked in a real chat.
CATEGORY_ARTWORK_ENABLED = "off"

# Point product carousel cards at a size variant, so WhatsApp renders its own
# size selector on the product page. "off" uses the product-level id, which is
# what Meta accepts today — a freshly synced variant can be in the catalog and
# still be refused by the messaging layer. Turn on only after a variant id has
# actually sent.
CATALOG_VARIANTS = "off"

# Offer cash on delivery beside online payment. A COD order is created in
# Shopify as PENDING with no transaction — the courier collects at the door,
# so marking it paid would corrupt the day's takings. See src/cod.ts.
COD = "on"
# Rupees added to a cash-on-delivery order. 0 switches the fee off entirely.
COD_FEE_INR = "180"

# Offer a discount code before checkout, validated against Shopify so the
# amount charged and the amount on the order agree. Needs read_discounts on
# the Shopify app. See src/coupons.ts.
COUPONS = "on"

# Ask for a delivery address before checkout, using WhatsApp's India address
# form. Needs no entitlement — unlike payments — so the order reaches Shopify
# fulfillable instead of tagged address-pending. "off" restores the old
# behaviour. See src/address.ts.
ADDRESS_CAPTURE = "on"

# How the occasion and category pickers are sent.
#   list     — interactive list messages. Free service messages, no template
#              approval and no billing, but no photography either
#   template — the approved carousels (default), with a list as the fallback
#              whenever a send is rejected
# Set to "list" while templates are pending approval or the account has no
# payment method, so the flow reaches checkout either way.

# Occasion / category pickers are approved carousel Marketing templates,
# billed at ~₹0.86 per delivered message (Meta's test number does not bill).
# A rejected send falls back to asking for a typed answer, not to a list.
OCCASION_TEMPLATE = "occasion_picker_v2"
CATEGORY_TEMPLATE = "category_picker"
TEMPLATE_LANGUAGE = "en_US"

# Shopify (India store). None of these three is sensitive, so they live here
# rather than as secrets. The key and secret are set with `wrangler secret put`.
IND_SHOPIFY_STORE = "reistor-life.myshopify.com"
IND_SHOPIFY_STORE_ID = "gid://shopify/Shop/52246577337"
IND_SHOPIFY_API_VERSION = "2026-04"

# Secrets — set these with `wrangler secret put <NAME>`, never in this file:
#   WHATSAPP_TOKEN     Meta system-user / temporary access token
#   PHONE_NUMBER_ID    WhatsApp Business phone number id
#   VERIFY_TOKEN       any string; must match what you paste into Meta

# Keeps logs in Cloudflare for a few days and makes them searchable in the
# dashboard, so reading them does not require a terminal open at the moment
# something happens. Without this, logs exist only while `wrangler tail` runs.
[observability]
enabled = true
head_sampling_rate = 1

# The nightly job: Shopify orders, Meta template stats and account health, the
# abandoned sweep, and a stock snapshot. 21:00 UTC is 02:30 IST.
#
# Reads only. Nothing on this schedule sends a WhatsApp message, so it cannot
# affect the number's quality rating.
[triggers]
crons = ["0 21 * * *"]
